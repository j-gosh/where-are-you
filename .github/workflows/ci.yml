name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: WAYCore (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        working-directory: Packages/WhereAreYouKit
        run: swift test

  app:
    name: App (build and unit tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('where-are-you.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      # Builds every target (app, both extensions, unit and UI tests) for the simulator.
      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project where-are-you.xcodeproj \
            -scheme where-are-you \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath DerivedData
      # UI tests are slow and timing-sensitive on shared runners; run them locally.
      - name: Unit tests
        run: |
          xcodebuild test-without-building \
            -project where-are-you.xcodeproj \
            -scheme where-are-you \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath DerivedData \
            -only-testing:where-are-youTests

  firebase:
    name: Firebase (rules and functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json
      # The Firestore emulator needs Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install dependencies
        run: |
          npm ci --prefix firebase
          npm ci --prefix firebase/functions
      - name: Type-check
        run: |
          npm run typecheck --prefix firebase
          npm run typecheck --prefix firebase/functions
      - name: Build functions
        run: npm run build --prefix firebase/functions
      - name: Functions unit tests
        run: npm run test:unit --prefix firebase/functions
      - name: Rules tests (emulator)
        working-directory: firebase
        run: npm test
      - name: Functions tests (emulator)
        working-directory: firebase/functions
        run: npm test
